name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Fix gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --parallel
        env:
          JAVA_OPTS: "-Dfile.encoding=UTF-8"
          GRADLE_OPTS: "-Dfile.encoding=UTF-8"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lava-boat-clutch-fix
          path: build/libs/*.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lava-boat-clutch-fix
          path: build/libs/

      - name: Publish to Modrinth, CurseForge & GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
          java: 25
          dependencies: |
            fabric-api(required)
            cloth-config(required)
            modmenu(optional)
