name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*fabric*.jar"
          out-file-path: "dist"

      - name: Publish Fabric/Quilt JAR
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*fabric*.jar
          loaders: |
            fabric
            quilt
          game-versions: |
            1.21.7
            1.21.8
          java: 21

  publish-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*neoforge*.jar"
          out-file-path: "dist"

      - name: Publish NeoForge JAR
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*neoforge*.jar
          loaders: |
            neoforge
          game-versions: |
            1.21.7
            1.21.8
          java: 21
