name: Check Build

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  GRADLE_OPTS: "-Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Normalize & verify Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "wrapper jar missing"; exit 1; }

      - name: Build Fabric
        run: ./gradlew :fabric:build --parallel --stacktrace

      - name: Build NeoForge
        run: ./gradlew :neoforge:build --parallel --stacktrace
